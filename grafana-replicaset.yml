apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: grafana-replicaset
  labels:
    app: grafana-rs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grafana-rs
  template:
    metadata:
      labels:
        app: grafana-rs
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
